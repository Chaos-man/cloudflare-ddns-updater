# Cloudflare DDNS updater. Set the values below in .env (copy .env.example), or replace
# the ${...} references with your values. Optional settings (IPv6, notifications,
# schedule, logging) go in .env; see README.Docker.md for the full list.
services:
  cloudflare-ddns:
    build: .
    image: cloudflare-ddns:latest
    container_name: cloudflare-ddns
    restart: unless-stopped
    env_file:
      - path: .env
        required: false
    environment:
      PUID: ${PUID:?Set PUID in .env}
      PGID: ${PGID:?Set PGID in .env}
      CF_API_TOKEN: ${CF_API_TOKEN:?Set CF_API_TOKEN in .env}
      CF_ZONE_ID: ${CF_ZONE_ID:?Set CF_ZONE_ID in .env}
      CF_RECORD_NAME: ${CF_RECORD_NAME:-}
    volumes:
      - ./logs:/logs
    # IPv6 (CF_RECORD_NAME_V6): Docker's default network has no IPv6. Use the host's network:
    # network_mode: host
    logging:
      driver: json-file
      options:
        max-size: "1m"
        max-file: "3"
