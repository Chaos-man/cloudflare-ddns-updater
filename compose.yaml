# Cloudflare DDNS updater. Set the values below in .env (copy .env.example), or replace
# the ${...} references with your values. For optional settings (IPv6, notifications,
# schedule, logging), add them in compose.override.yaml rather than editing this file,
# and set the values in .env. See README.Docker.md.
services:
  cloudflare-ddns:
    image: chaosmanorg/cloudflare-ddns:latest   # Docker Hub; pin a version (e.g. :1.0.0) if you prefer
    build: .                                    # Only used by `docker compose build` from a clone
    container_name: cloudflare-ddns
    restart: unless-stopped
    environment:
      PUID: ${PUID:?Set PUID in .env}
      PGID: ${PGID:?Set PGID in .env}
      CF_API_TOKEN: ${CF_API_TOKEN:?Set CF_API_TOKEN in .env}
      CF_ZONE_ID: ${CF_ZONE_ID:?Set CF_ZONE_ID in .env}
      CF_RECORD_NAME: ${CF_RECORD_NAME:-}
    volumes:
      - ./logs:/logs
    # IPv6 (CF_RECORD_NAME_V6): Docker's default network has no IPv6. Use the host's
    # network by adding `network_mode: host` (in compose.override.yaml, see README.Docker.md):
    # network_mode: host
    logging:
      driver: json-file
      options:
        max-size: "1m"
        max-file: "3"
